<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEVON · Tributo Keane Coldplay Travis</title>
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Portal de setlists y repertorio del tributo a Keane, Coldplay y Travis.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEVON">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --oro:#e8b93b;--oro2:#f7d774;--tinta:#0b1220;--sub:#6b7a8f;
  --cp:#e8b93b;--ke:#4a8fe0;--tr:#2fa37a;
  --card:#ffffff;--borde:rgba(232,185,59,.35);
  --sombra:0 18px 45px rgba(0,0,0,.45);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Inter',sans-serif;
  background:linear-gradient(160deg,#050a16 0%,#0d1830 45%,#050a16 100%) fixed;
  min-height:100vh;color:var(--tinta);padding:14px 10px 44px;
  line-height:1.4;transition:background .3s ease;
}
body.dia{background:linear-gradient(160deg,#dde6f2 0%,#f3f6fa 45%,#dde6f2 100%) fixed}
body.show{background:linear-gradient(160deg,#000000 0%,#0a0a0a 45%,#000000 100%) fixed}

.wrap{max-width:880px;margin:0 auto}

/* ══════ HEADER ══════ */
.top{
  background:linear-gradient(135deg,#0d1830 0%,#16233f 100%);
  border:1px solid rgba(232,185,59,.28);border-radius:22px;
  padding:14px 16px;display:flex;align-items:center;gap:13px;
  box-shadow:var(--sombra);margin-bottom:12px;
}
body.show .top{background:linear-gradient(135deg,#000,#111);border-color:rgba(232,185,59,.5)}
.logo{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--oro),var(--oro2));
  display:grid;place-items:center;flex:0 0 auto;
  font-family:Georgia,serif;font-weight:900;font-size:1.55rem;color:#0b1220;
  box-shadow:0 0 0 3px rgba(232,185,59,.16);
}
.brand h1{
  font-family:Georgia,'Times New Roman',serif;font-size:1.22rem;
  color:var(--oro);letter-spacing:.6px;line-height:1.1;
}
.brand p{font-size:.74rem;color:#c9d6e8;letter-spacing:.7px;margin-top:3px}

/* ══════ MODOS ══════ */
.modos{
  display:flex;gap:6px;margin-bottom:12px;
}
.modos button{
  flex:1;padding:9px 8px;border-radius:12px;
  border:1px solid rgba(232,185,59,.28);
  background:rgba(255,255,255,.06);color:#c9d6e8;
  font-family:inherit;font-size:.78rem;font-weight:800;cursor:pointer;
  transition:.15s;
}
.modos button.on{
  background:linear-gradient(135deg,var(--oro),var(--oro2));
  color:#0b1220;border-color:#0b1220;
  box-shadow:0 4px 14px rgba(232,185,59,.35);
}

/* ══════ GLOBAL PROGRESS ══════ */
.global{
  background:#fff;border-radius:14px;padding:11px 15px;
  display:flex;align-items:center;gap:11px;
  box-shadow:0 6px 20px rgba(0,0,0,.20);
  margin-bottom:12px;border:1px solid var(--borde);
}
body.show .global{background:#111;border-color:rgba(232,185,59,.4)}
.global .lbl{font-size:.7rem;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
body.show .global .lbl{color:#c9d6e8}
.global .num{font-size:.76rem;font-weight:900;color:var(--tinta);white-space:nowrap}
body.show .global .num{color:#e8b93b}
.bar{flex:1;height:10px;background:#e8edf4;border-radius:20px;overflow:hidden;min-width:50px}
body.show .bar{background:rgba(232,185,59,.15)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),var(--oro2));border-radius:20px;transition:width .35s ease}
.bar.small{height:7px}

/* ══════ HOME ══════ */
.h2{
  font-family:Georgia,serif;font-size:1.05rem;font-weight:900;color:#fff;
  margin:16px 0 10px;letter-spacing:.3px;
}
body.dia .h2{color:var(--tinta)}
body.show .h2{color:var(--oro)}

.sl-card{
  background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;
  border:1px solid var(--borde);border-left:6px solid var(--oro);
  box-shadow:0 6px 18px rgba(0,0,0,.20);
  cursor:pointer;transition:.2s;display:flex;align-items:center;gap:13px;
}
.sl-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.30)}
body.show .sl-card{background:#111;border-color:rgba(232,185,59,.4)}
.sl-icono{
  font-size:1.7rem;width:48px;height:48px;border-radius:12px;
  display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(135deg,#faf3e0,#f5e6c8);
  border:1px solid var(--borde);
}
body.show .sl-icono{background:linear-gradient(135deg,#1a1a1a,#222);border-color:rgba(232,185,59,.4)}
.sl-info{flex:1;min-width:0}
.sl-tipo{
  display:inline-block;font-size:.62rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.7px;padding:2px 9px;border-radius:20px;margin-bottom:4px;
}
.sl-tipo.oficial{background:linear-gradient(135deg,var(--oro),var(--oro2));color:#0b1220}
.sl-tipo.ensayo{background:#dbeafe;color:#1d4ed8}
.sl-tipo.show{background:#ede9fe;color:#6d28d9}
.sl-tipo.otro{background:#dcfce7;color:#15803d}
.sl-nombre{font-size:.92rem;font-weight:900;color:var(--tinta);line-height:1.25}
body.show .sl-nombre{color:#e8b93b}
.sl-meta{font-size:.7rem;color:var(--sub);font-weight:700;margin-top:2px}
body.show .sl-meta{color:#c9d6e8}
.sl-num{
  font-family:Georgia,serif;font-size:1.15rem;font-weight:900;color:var(--oro);
  background:rgba(232,185,59,.15);padding:6px 12px;border-radius:20px;
  border:1px solid var(--borde);white-space:nowrap;flex:0 0 auto;
}

.btn-prim{
  width:100%;background:linear-gradient(135deg,var(--oro),var(--oro2));
  color:#0b1220;border:none;padding:14px 18px;border-radius:14px;
  font-family:inherit;font-weight:900;font-size:.88rem;cursor:pointer;
  box-shadow:0 4px 14px rgba(232,185,59,.35);transition:.15s;
  margin-top:8px;letter-spacing:.3px;
}
.btn-prim:active{transform:scale(.98)}

/* ══════ DETAIL VIEW ══════ */
.back{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;color:var(--tinta);border:1px solid var(--borde);
  padding:9px 16px;border-radius:30px;font-weight:800;font-size:.8rem;
  cursor:pointer;font-family:inherit;margin-bottom:12px;transition:.15s;
}
.back:hover{background:var(--oro);color:#0b1220;border-color:#0b1220}
body.show .back{background:#111;color:#e8b93b;border-color:rgba(232,185,59,.4)}

.detail-head{
  background:linear-gradient(135deg,#0d1830,#16233f);
  border-radius:18px;padding:18px 20px;margin-bottom:12px;
  border:1px solid rgba(232,185,59,.28);box-shadow:var(--sombra);
}
body.show .detail-head{background:linear-gradient(135deg,#000,#111);border-color:rgba(232,185,59,.5)}
.detail-head .tipo{
  display:inline-block;font-size:.65rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.8px;padding:3px 10px;border-radius:20px;margin-bottom:8px;
}
.detail-head .tipo.oficial{background:linear-gradient(135deg,var(--oro),var(--oro2));color:#0b1220}
.detail-head .tipo.ensayo{background:#dbeafe;color:#1d4ed8}
.detail-head .tipo.show{background:#ede9fe;color:#6d28d9}
.detail-head .tipo.otro{background:#dcfce7;color:#15803d}
.detail-head h2{
  font-family:Georgia,serif;font-size:1.3rem;color:var(--oro);
  line-height:1.2;margin-bottom:6px;
}
.detail-head .meta{font-size:.75rem;color:#c9d6e8;font-weight:700}

/* ══════ SONGS ══════ */
.songs-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 4px;margin-bottom:6px;
}
.songs-head h3{font-family:Georgia,serif;font-size:.95rem;font-weight:900;color:#fff}
body.dia .songs-head h3{color:var(--tinta)}
body.show .songs-head h3{color:var(--oro)}
.songs-head .cnt{
  font-size:.72rem;font-weight:900;color:var(--oro);
  background:rgba(232,185,59,.15);padding:4px 12px;border-radius:20px;
  border:1px solid var(--borde);
}

.song{
  display:flex;align-items:center;gap:9px;
  background:#fff;border-radius:13px;padding:10px 12px;margin-bottom:7px;
  border:1px solid var(--borde);border-left:4px solid var(--oro);
  transition:.15s;
}
.song:hover{box-shadow:0 4px 12px rgba(0,0,0,.12)}
body.show .song{background:#111;border-color:rgba(232,185,59,.35)}
.song.listo{background:linear-gradient(90deg,rgba(232,185,59,.10),transparent)}
body.show .song.listo{background:linear-gradient(90deg,rgba(232,185,59,.15),transparent)}

.chk{
  width:30px;height:30px;flex:0 0 auto;border-radius:50%;
  border:2px solid #cbd5e1;background:#fff;color:transparent;
  font-size:.85rem;font-weight:900;cursor:pointer;
  display:grid;place-items:center;transition:.16s;font-family:inherit;padding:0;
}
.chk:active{transform:scale(.9)}
.chk.on{
  background:linear-gradient(135deg,var(--oro),var(--oro2));
  border-color:#0b1220;color:#0b1220;
  box-shadow:0 3px 10px rgba(232,185,59,.35);
}
body.show .chk{background:#1a1a1a;border-color:rgba(232,185,59,.4)}
body.show .chk.on{background:linear-gradient(135deg,var(--oro),var(--oro2));color:#0b1220}

.song-info{flex:1;min-width:0}
.song-t{font-size:.85rem;font-weight:800;color:var(--tinta);line-height:1.25}
body.show .song-t{color:#e8b93b}
.song-b{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.66rem;color:var(--sub);font-weight:800;margin-top:2px;
}
body.show .song-b{color:#c9d6e8}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.cp{background:var(--cp)}
.dot.ke{background:var(--ke)}
.dot.tr{background:var(--tr)}

.acts{display:flex;gap:5px;flex:0 0 auto}
.mini{
  width:32px;height:32px;border-radius:9px;border:none;
  display:grid;place-items:center;font-size:.85rem;cursor:pointer;
  text-decoration:none;transition:.14s;font-family:inherit;padding:0;
}
.mini:active{transform:scale(.9)}
.mini.yt{background:#ffe8ea;color:#e63946}
.mini.live{background:#efe8ff;color:#7c4dff}
.mini.letra{background:#fff5db;color:#b8860b}
body.show .mini.yt{background:rgba(230,57,70,.22)}
body.show .mini.live{background:rgba(124,77,255,.22)}
body.show .mini.letra{background:rgba(232,185,59,.20)}

.empty{
  background:#fff;border-radius:14px;padding:22px 18px;
  border:2px dashed var(--borde);text-align:center;color:var(--sub);
  font-size:.85rem;line-height:1.55;margin-bottom:12px;
}
body.show .empty{background:#111;color:#c9d6e8}
.empty strong{color:var(--oro);display:block;font-family:Georgia,serif;font-size:1rem;margin-bottom:6px}

/* ══════ MODAL ══════ */
.modal-root{position:fixed;inset:0;display:none;z-index:999}
.modal-root.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(3,7,15,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{
  position:relative;max-width:560px;margin:26px auto;
  background:#fff;border-radius:20px;
  max-height:calc(100vh - 52px);display:flex;flex-direction:column;
  overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.65);
  border:1px solid var(--borde);animation:pop .18s ease;
}
@keyframes pop{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{
  display:flex;align-items:flex-start;gap:10px;
  padding:15px 17px;background:linear-gradient(135deg,#0d1830,#16233f);
}
.mh-title{font-family:Georgia,serif;font-size:1rem;font-weight:900;color:var(--oro);line-height:1.2}
.mh-sub{font-size:.72rem;color:#c9d6e8;margin-top:3px}
.x{
  margin-left:auto;background:rgba(255,255,255,.13);border:none;color:#fff;
  width:32px;height:32px;border-radius:50%;font-size:.95rem;cursor:pointer;
  flex:0 0 auto;font-family:inherit;
}
.modal-body{padding:15px 17px;overflow-y:auto;-webkit-overflow-scrolling:touch}

.field{margin-bottom:12px}
.field label{display:block;font-size:.72rem;font-weight:900;color:#b8860b;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border-radius:11px;border:2px solid #e2e8f0;
  font-family:inherit;font-size:.9rem;color:var(--tinta);background:#fbfcfe;
  outline:none;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--oro);box-shadow:0 0 0 4px rgba(232,185,59,.18);
}
.field textarea{
  min-height:220px;font-family:'Courier New',monospace;font-size:.82rem;
  line-height:1.6;resize:vertical;
}
.field .hint{font-size:.7rem;color:var(--sub);margin-top:4px;font-style:italic}

.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{
  flex:1;padding:11px 16px;border-radius:11px;font-family:inherit;
  font-weight:800;font-size:.82rem;cursor:pointer;transition:.15s;border:none;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-prim2{background:linear-gradient(135deg,var(--oro),var(--oro2));color:#0b1220}
.btn-prim2:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(232,185,59,.40)}
.btn-sec{background:#f1f5f9;color:var(--tinta);border:1px solid #e2e8f0}
.btn-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}

.pick-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;
  border-bottom:1px solid #eef2f8;cursor:pointer;
}
.pick-row:hover{background:#f8fafc}
.pick-row .box{
  width:22px;height:22px;border-radius:7px;border:2px solid #cbd5e1;
  display:grid;place-items:center;font-size:.7rem;color:#fff;flex:0 0 auto;
  transition:.14s;background:#fff;
}
.pick-row.sel .box{background:linear-gradient(135deg,var(--oro),var(--oro2));border-color:#b8860b;color:#0b1220}
.pick-row .pick-info{flex:1;min-width:0;font-size:.82rem;font-weight:700;color:var(--tinta)}
.pick-row .pick-b{font-size:.66rem;color:var(--sub);font-weight:700;margin-top:1px}
.pick-band{
  font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;
  color:#b8860b;padding:11px 10px 4px;background:#fff;
}

/* ══════ AVISO ══════ */
.aviso{
  display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#0d1830,#16233f);color:var(--oro);
  padding:12px 24px;border-radius:40px;font-weight:800;font-size:.82rem;
  box-shadow:0 10px 30px rgba(0,0,0,.50);z-index:3000;border:2px solid var(--oro);
  white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;
}
.aviso.show{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ══════ FOOTER ══════ */
.footer{
  text-align:center;margin-top:26px;padding-top:16px;
  font-size:.72rem;color:#8fa6c4;line-height:1.8;
}
.footer strong{color:var(--oro)}

@media(max-width:420px){
  .brand h1{font-size:1.08rem}
  .song-t{font-size:.8rem}
  .mini{width:30px;height:30px;font-size:.78rem}
  .sl-nombre{font-size:.86rem}
}
</style>
</head>
<body>

<div class="aviso" id="aviso">Listo</div>

<div class="wrap">

  <!-- ══════ HOME ══════ -->
  <div id="view-home">
    <header class="top">
      <div class="logo">D</div>
      <div class="brand">
        <h1>DEVON</h1>
        <p>Tributo Keane · Coldplay · Travis</p>
      </div>
    </header>

    <div class="modos">
      <button data-modo="dia"   onclick="cambiarModo('dia')">☀️ Día</button>
      <button data-modo="noche" onclick="cambiarModo('noche')" class="on">🌙 Noche</button>
      <button data-modo="show"  onclick="cambiarModo('show')">🎤 Show</button>
    </div>

    <div class="global">
      <span class="lbl">Avance total</span>
      <div class="bar"><i id="globalFill"></i></div>
      <span class="num" id="globalTxt">0/0</span>
    </div>

    <h2 class="h2">🎵 Nuestros Setlists</h2>
    <div id="lista-setlists"></div>

    <button class="btn-prim" onclick="abrirNuevoSetlist()">➕ Crear nuevo setlist</button>
  </div>

  <!-- ══════ DETAIL ══════ -->
  <div id="view-detail" hidden>
    <button class="back" onclick="volverHome()">← Volver a setlists</button>
    <div id="detail-content"></div>
  </div>

  <div class="footer">
    <p><strong>DEVON</strong> · Tributo Keane · Coldplay · Travis</p>
    <p>Hecho para el escenario 🎤</p>
  </div>
</div>

<!-- ══════ MODAL NUEVO SETLIST ══════ -->
<div class="modal-root" id="modal-nuevo">
  <div class="modal-bg" data-close></div>
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="mh-title">Nuevo setlist</div>
        <div class="mh-sub">Ensayo, show u otro</div>
      </div>
      <button class="x" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Tipo</label>
        <select id="ns-tipo">
          <option value="ensayo">🎤 Ensayo</option>
          <option value="show">🎉 Show</option>
          <option value="otro">🎵 Otro</option>
        </select>
      </div>
      <div class="field">
        <label>Nombre</label>
        <input id="ns-nombre" type="text" placeholder="Ej: Ensayo 1" maxlength="50">
      </div>
      <div class="field">
        <label>Fecha (opcional)</label>
        <input id="ns-fecha" type="date">
      </div>
      <div class="row">
        <button class="btn btn-sec" data-close>Cancelar</button>
        <button class="btn btn-prim2" onclick="crearSetlist()">✅ Crear</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════ MODAL AGREGAR CANCIONES ══════ -->
<div class="modal-root" id="modal-picker">
  <div class="modal-bg" data-close></div>
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="mh-title">Agregar canciones</div>
        <div class="mh-sub" id="picker-sub">—</div>
      </div>
      <button class="x" data-close>✕</button>
    </div>
    <div class="modal-body">
      <input class="field" style="margin-bottom:8px" id="picker-buscar" type="search" placeholder="🔍 Buscar canción...">
      <div id="picker-lista"></div>
      <div class="row">
        <button class="btn btn-sec" data-close>Cancelar</button>
        <button class="btn btn-prim2" onclick="confirmarPicker()">✅ Guardar selección</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════ MODAL LETRA ══════ -->
<div class="modal-root" id="modal-letra">
  <div class="modal-bg" data-close></div>
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="mh-title" id="letra-title">Letra</div>
        <div class="mh-sub" id="letra-sub">—</div>
      </div>
      <button class="x" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Letra</label>
        <textarea id="letra-input" placeholder="Pegá acá la letra..."></textarea>
        <div class="hint">Se guarda solo en este dispositivo.</div>
      </div>
      <div class="row">
        <button class="btn btn-sec" data-close>Cerrar</button>
        <button class="btn btn-prim2" onclick="guardarLetra()">💾 Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CANCIONES · 32 temas en orden alfabético
   ═══════════════════════════════════════════════════════════ */
const CANCIONES = [
  { id:'coldplay-adventure-of-a-lifetime', t:'Adventure of a Lifetime', b:'Coldplay', bc:'cp' },
  { id:'travis-all-i-want-to-do-is-rock',  t:'All I Want to Do Is Rock', b:'Travis',   bc:'tr' },
  { id:'keane-bedshaped',                  t:'Bedshaped', b:'Keane', bc:'ke' },
  { id:'keane-bend-break',                 t:'Bend & Break', b:'Keane', bc:'ke' },
  { id:'coldplay-clocks',                  t:'Clocks', b:'Coldplay', bc:'cp' },
  { id:'travis-closer',                    t:'Closer', b:'Travis', bc:'tr' },
  { id:'keane-crystal-ball',               t:'Crystal Ball', b:'Keane', bc:'ke' },
  { id:'coldplay-dont-panic',              t:"Don't Panic", b:'Coldplay', bc:'cp' },
  { id:'keane-everybodys-changing',        t:"Everybody's Changing", b:'Keane', bc:'ke' },
  { id:'coldplay-fix-you',                 t:'Fix You', b:'Coldplay', bc:'cp' },
  { id:'travis-happy-to-hang-around',      t:'Happy to Hang Around', b:'Travis', bc:'tr' },
  { id:'coldplay-in-my-place',             t:'In My Place', b:'Coldplay', bc:'cp' },
  { id:'keane-is-it-any-wonder',           t:'Is It Any Wonder?', b:'Keane', bc:'ke' },
  { id:'coldplay-magic',                   t:'Magic', b:'Coldplay', bc:'cp' },
  { id:'keane-nothing-in-my-way',          t:'Nothing in My Way', b:'Keane', bc:'ke' },
  { id:'travis-re-offender',               t:'Re-Offender', b:'Travis', bc:'tr' },
  { id:'coldplay-shiver',                  t:'Shiver', b:'Coldplay', bc:'cp' },
  { id:'travis-side',                      t:'Side', b:'Travis', bc:'tr' },
  { id:'travis-sing',                      t:'Sing', b:'Travis', bc:'tr' },
  { id:'keane-somewhere-only-we-know',     t:'Somewhere Only We Know', b:'Keane', bc:'ke' },
  { id:'coldplay-speed-of-sound',          t:'Speed of Sound', b:'Coldplay', bc:'cp' },
  { id:'travis-the-beautiful-occupation',  t:'The Beautiful Occupation', b:'Travis', bc:'tr' },
  { id:'coldplay-the-scientist',           t:'The Scientist', b:'Coldplay', bc:'cp' },
  { id:'keane-this-is-the-last-time',      t:'This Is the Last Time', b:'Keane', bc:'ke' },
  { id:'coldplay-trouble',                 t:'Trouble', b:'Coldplay', bc:'cp' },
  { id:'travis-turn',                      t:'Turn', b:'Travis', bc:'tr' },
  { id:'coldplay-viva-la-vida',            t:'Viva la Vida', b:'Coldplay', bc:'cp' },
  { id:'keane-we-might-as-well-be-strangers', t:'We Might as Well Be Strangers', b:'Keane', bc:'ke' },
  { id:'travis-why-does-it-always-rain-on-me', t:'Why Does It Always Rain on Me?', b:'Travis', bc:'tr' },
  { id:'travis-writing-to-reach-you',      t:'Writing to Reach You', b:'Travis', bc:'tr' },
  { id:'coldplay-yellow',                  t:'Yellow', b:'Coldplay', bc:'cp' },
  { id:'keane-your-eyes-open',             t:'Your Eyes Open', b:'Keane', bc:'ke' }
];
const SONG_MAP = {};
CANCIONES.forEach(s => SONG_MAP[s.id] = s);

const OFICIAL_IDS = CANCIONES.map(s => s.id);

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const KEY = 'devon-tribute-v1';

function initialState(){
  return {
    v: 1,
    modo: 'noche',
    letras: {},
    links: {},
    setlists: [
      { id:'oficial', nombre:'Setlist Oficial', tipo:'oficial', fecha:'',
        canciones:[...OFICIAL_IDS], checks:{} }
    ]
  };
}

let state = load();

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return initialState();
    const p = JSON.parse(raw);
    const base = initialState();
    return {
      v: 1,
      modo: p.modo || 'noche',
      letras: p.letras || {},
      links: p.links || {},
      setlists: Array.isArray(p.setlists) && p.setlists.length ? p.setlists : base.setlists
    };
  } catch(e){ return initialState(); }
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   UTILIDADES
   ═══════════════════════════════════════════════════════════ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function avisar(txt){
  const el = document.getElementById('aviso');
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}
function ytSearch(q){
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
}
function linkOrig(id){
  const s = SONG_MAP[id];
  return (state.links[id] && state.links[id].orig) ||
    ytSearch(s.b + ' ' + s.t + ' official audio');
}
function linkLive(id){
  const s = SONG_MAP[id];
  return (state.links[id] && state.links[id].live) ||
    ytSearch(s.b + ' ' + s.t + ' live');
}

/* ═══════════════════════════════════════════════════════════
   MODOS
   ═══════════════════════════════════════════════════════════ */
function cambiarModo(modo){
  document.body.classList.remove('dia','show');
  if (modo === 'dia') document.body.classList.add('dia');
  else if (modo === 'show') document.body.classList.add('show');
  document.querySelectorAll('.modos button').forEach(b =>
    b.classList.toggle('on', b.dataset.modo === modo));
  state.modo = modo;
  save();
}

/* ═══════════════════════════════════════════════════════════
   PROGRESO GLOBAL
   ═══════════════════════════════════════════════════════════ */
function refreshGlobal(){
  let total = 0, hechas = 0;
  state.setlists.forEach(sl => {
    total += sl.canciones.length;
    hechas += sl.canciones.filter(id => sl.checks[id]).length;
  });
  const pct = total ? Math.round(hechas / total * 100) : 0;
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('globalTxt').textContent = hechas + '/' + total + ' · ' + pct + '%';
}

/* ═══════════════════════════════════════════════════════════
   HOME
   ═══════════════════════════════════════════════════════════ */
function renderHome(){
  const cont = document.getElementById('lista-setlists');
  if (!state.setlists.length){
    cont.innerHTML = '<div class="empty"><strong>Sin setlists</strong>Tocá "Crear nuevo setlist" para empezar.</div>';
    return;
  }
  cont.innerHTML = state.setlists.map(sl => {
    const total = sl.canciones.length;
    const hechas = sl.canciones.filter(id => sl.checks[id]).length;
    const emoji = sl.tipo === 'oficial' ? '🎯' : sl.tipo === 'show' ? '🎉' : sl.tipo === 'ensayo' ? '🎤' : '🎵';
    return `
      <div class="sl-card" onclick="abrirSetlist('${sl.id}')">
        <div class="sl-icono">${emoji}</div>
        <div class="sl-info">
          <span class="sl-tipo ${sl.tipo}">${sl.tipo}</span>
          <div class="sl-nombre">${esc(sl.nombre)}</div>
          <div class="sl-meta">${sl.fecha ? '📅 ' + sl.fecha + ' · ' : ''}${hechas} de ${total} listas</div>
        </div>
        <div class="sl-num">${total}</div>
      </div>
    `;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   ABRIR / CERRAR SETLIST
   ═══════════════════════════════════════════════════════════ */
let currentSetlistId = null;

function abrirSetlist(id){
  currentSetlistId = id;
  document.getElementById('view-home').hidden = true;
  document.getElementById('view-detail').hidden = false;
  renderDetail();
  window.scrollTo({top:0, behavior:'instant'});
}

function volverHome(){
  currentSetlistId = null;
  document.getElementById('view-detail').hidden = true;
  document.getElementById('view-home').hidden = false;
  renderHome();
  refreshGlobal();
  window.scrollTo({top:0, behavior:'instant'});
}

function getSL(id){ return state.setlists.find(s => s.id === id); }

/* ═══════════════════════════════════════════════════════════
   DETALLE DEL SETLIST
   ═══════════════════════════════════════════════════════════ */
function renderDetail(){
  const sl = getSL(currentSetlistId);
  if (!sl){ volverHome(); return; }

  const total = sl.canciones.length;
  const hechas = sl.canciones.filter(id => sl.checks[id]).length;
  const pct = total ? Math.round(hechas / total * 100) : 0;

  const emoji = sl.tipo === 'oficial' ? '🎯' : sl.tipo === 'show' ? '🎉' : sl.tipo === 'ensayo' ? '🎤' : '🎵';

  let songsHTML = '';
  if (!sl.canciones.length){
    songsHTML = '<div class="empty"><strong>Sin canciones todavía</strong>Tocá "Agregar canciones" para sumar temas del repertorio.</div>';
  } else {
    songsHTML = sl.canciones.map(id => {
      const s = SONG_MAP[id];
      if (!s) return '';
      const on = !!sl.checks[id];
      return `
        <div class="song ${on ? 'listo' : ''}">
          <button class="chk ${on ? 'on' : ''}" onclick="toggleCheck('${id}')">${on ? '✓' : ''}</button>
          <div class="song-info">
            <div class="song-t">${esc(s.t)}</div>
            <div class="song-b"><span class="dot ${s.bc}"></span>${esc(s.b)}</div>
          </div>
          <div class="acts">
            <a class="mini yt" href="${linkOrig(id)}" target="_blank" rel="noopener" title="Original">▶</a>
            <a class="mini live" href="${linkLive(id)}" target="_blank" rel="noopener" title="En vivo">🎬</a>
            <button class="mini letra" onclick="abrirLetra('${id}')" title="Letra">📄</button>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-head">
      <span class="tipo ${sl.tipo}">${emoji} ${sl.tipo}</span>
      <h2>${esc(sl.nombre)}</h2>
      <div class="meta">${sl.fecha ? '📅 ' + sl.fecha + ' · ' : ''}${hechas} de ${total} listas</div>
    </div>

    <div class="global" style="margin-bottom:10px">
      <span class="lbl">Avance</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span class="num">${pct}%</span>
    </div>

    <div class="songs-head">
      <h3>🎵 Canciones</h3>
      <span class="cnt">${total}</span>
    </div>

    ${songsHTML}

    <div class="row" style="margin-top:14px">
      <button class="btn btn-prim2" onclick="abrirPicker()">➕ Agregar canciones</button>
      ${sl.tipo !== 'oficial' ? `<button class="btn btn-danger" onclick="borrarSetlist()">🗑️ Borrar setlist</button>` : ''}
    </div>
  `;
}

function toggleCheck(songId){
  const sl = getSL(currentSetlistId);
  if (!sl) return;
  if (sl.checks[songId]) delete sl.checks[songId];
  else sl.checks[songId] = 1;
  save();
  renderDetail();
}

/* ═══════════════════════════════════════════════════════════
   MODAL NUEVO SETLIST
   ═══════════════════════════════════════════════════════════ */
function abrirNuevoSetlist(){
  document.getElementById('ns-nombre').value = '';
  document.getElementById('ns-fecha').value = '';
  document.getElementById('ns-tipo').value = 'ensayo';
  document.getElementById('modal-nuevo').classList.add('open');
  setTimeout(() => document.getElementById('ns-nombre').focus(), 100);
}

function crearSetlist(){
  const tipo = document.getElementById('ns-tipo').value;
  const nombre = document.getElementById('ns-nombre').value.trim();
  const fecha = document.getElementById('ns-fecha').value;

  if (!nombre){ avisar('⚠️ Poné un nombre'); return; }

  state.setlists.push({
    id: 'sl-' + Date.now(),
    nombre: nombre,
    tipo: tipo,
    fecha: fecha,
    canciones: [],
    checks: {}
  });
  save();
  closeModal('modal-nuevo');
  renderHome();
  refreshGlobal();
  avisar('✅ Setlist creado');
}

/* ═══════════════════════════════════════════════════════════
   PICKER DE CANCIONES
   ═══════════════════════════════════════════════════════════ */
let pickerSel = new Set();

function abrirPicker(){
  const sl = getSL(currentSetlistId);
  if (!sl) return;
  document.getElementById('picker-sub').textContent = sl.nombre;
  pickerSel = new Set(sl.canciones);
  document.getElementById('picker-buscar').value = '';
  renderPicker();
  document.getElementById('modal-picker').classList.add('open');
}

function renderPicker(){
  const bands = [
    { name:'Coldplay', ids: CANCIONES.filter(s => s.b === 'Coldplay').map(s => s.id), emoji:'🌙' },
    { name:'Keane',    ids: CANCIONES.filter(s => s.b === 'Keane').map(s => s.id),    emoji:'🎹' },
    { name:'Travis',   ids: CANCIONES.filter(s => s.b === 'Travis').map(s => s.id),   emoji:'🌧️' }
  ];
  let html = '';
  bands.forEach(band => {
    html += `<div class="pick-band">${band.emoji} ${band.name}</div>`;
    band.ids.forEach(id => {
      const s = SONG_MAP[id];
      const sel = pickerSel.has(id);
      html += `
        <div class="pick-row ${sel ? 'sel' : ''}" data-pick="${id}" data-search="${esc((s.t + ' ' + s.b).toLowerCase())}">
          <div class="box">${sel ? '✓' : ''}</div>
          <div class="pick-info">
            ${esc(s.t)}
            <div class="pick-b">${s.b}</div>
          </div>
        </div>
      `;
    });
  });
  document.getElementById('picker-lista').innerHTML = html;
}

function confirmarPicker(){
  const sl = getSL(currentSetlistId);
  if (!sl) return;
  // Reconstruir en orden alfabético
  sl.canciones = CANCIONES.filter(s => pickerSel.has(s.id)).map(s => s.id);
  // Limpiar checks de canciones que ya no están
  Object.keys(sl.checks).forEach(id => {
    if (!sl.canciones.includes(id)) delete sl.checks[id];
  });
  save();
  closeModal('modal-picker');
  renderDetail();
  avisar('✅ Canciones guardadas');
}

/* ═══════════════════════════════════════════════════════════
   MODAL LETRA
   ═══════════════════════════════════════════════════════════ */
let letraActualId = null;

function abrirLetra(songId){
  const s = SONG_MAP[songId];
  if (!s) return;
  letraActualId = songId;
  document.getElementById('letra-title').textContent = s.t;
  document.getElementById('letra-sub').textContent = s.b;
  document.getElementById('letra-input').value = state.letras[songId] || '';
  document.getElementById('modal-letra').classList.add('open');
}

function guardarLetra(){
  if (!letraActualId) return;
  const txt = document.getElementById('letra-input').value.trim();
  if (txt) state.letras[letraActualId] = txt;
  else delete state.letras[letraActualId];
  save();
  closeModal('modal-letra');
  avisar('💾 Letra guardada');
}

/* ═══════════════════════════════════════════════════════════
   BORRAR SETLIST
   ═══════════════════════════════════════════════════════════ */
function borrarSetlist(){
  const sl = getSL(currentSetlistId);
  if (!sl || sl.tipo === 'oficial') return;
  if (!confirm('¿Borrar el setlist "' + sl.nombre + '"? No se puede deshacer.')) return;
  state.setlists = state.setlists.filter(s => s.id !== sl.id);
  save();
  volverHome();
  avisar('🗑️ Setlist borrado');
}

/* ═══════════════════════════════════════════════════════════
   MODALES · ABRIR/CERRAR
   ═══════════════════════════════════════════════════════════ */
function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-root').forEach(root => {
  root.addEventListener('click', e => {
    if (e.target.matches('[data-close]') || e.target.matches('.modal-bg')){
      root.classList.remove('open');
    }
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    document.querySelectorAll('.modal-root.open').forEach(m => m.classList.remove('open'));
  }
});

/* ═══════════════════════════════════════════════════════════
   DELEGACIÓN · PICKER + BUSCAR
   ═══════════════════════════════════════════════════════════ */
document.getElementById('picker-lista').addEventListener('click', e => {
  const row = e.target.closest('[data-pick]');
  if (!row) return;
  const id = row.dataset.pick;
  if (pickerSel.has(id)) pickerSel.delete(id);
  else pickerSel.add(id);
  renderPicker();
});

document.getElementById('picker-buscar').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('#picker-lista .pick-row').forEach(row => {
    const ok = !q || row.dataset.search.indexOf(q) !== -1;
    row.style.display = ok ? '' : 'none';
  });
});

/* ═══════════════════════════════════════════════════════════
   INICIALIZAR
   ═══════════════════════════════════════════════════════════ */
cambiarModo(state.modo || 'noche');
renderHome();
refreshGlobal();

// PWA
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
