<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEVON · Tributo Keane Coldplay Travis</title>
<meta name="theme-color" content="#12063a">
<meta name="description" content="Portal de setlists y repertorio del tributo a Keane, Coldplay y Travis.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEVON">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  /* Fondo espacial */
  --bg-deep:#05021a;
  --bg-mid:#12063a;

  /* Neón Mylo Xyloto */
  --pink:#ff2d95;
  --pink-soft:#ff8ac7;
  --purple:#a855f7;
  --cyan:#00d9ff;
  --cyan-soft:#7fecff;
  --yellow:#ffe14a;
  --yellow-soft:#fff08a;
  --green:#39ff88;
  --orange:#ff8a3d;

  /* Bandas */
  --cp:#ff2d95;
  --ke:#00d9ff;
  --tr:#39ff88;

  /* Texto */
  --text:#f5f5ff;
  --sub:#b0a4d4;

  /* Cards oscuras */
  --card:rgba(16,8,56,.72);
  --card-2:rgba(26,10,72,.72);
  --border:rgba(255,45,149,.30);
  --border-soft:rgba(255,255,255,.10);

  --shadow:0 18px 45px rgba(0,0,0,.55);
}

html{-webkit-text-size-adjust:100%}

body{
  font-family:'Segoe UI',system-ui,-apple-system,'Inter',sans-serif;
  min-height:100vh;
  color:var(--text);
  padding:14px 10px 44px;
  line-height:1.4;
  overflow-x:hidden;
}

/* ══════ FONDO ESPACIAL ══════ */
.bg-layer{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,45,149,.20), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(0,217,255,.16), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(168,85,247,.10), transparent 55%),
    radial-gradient(circle at 90% 20%, rgba(255,225,74,.08), transparent 40%),
    radial-gradient(circle at 10% 85%, rgba(57,255,136,.08), transparent 40%),
    linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 50%, var(--bg-deep) 100%);
  pointer-events:none;
  transition:opacity .4s;
}
.bg-layer::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff, transparent),
    radial-gradient(1px 1px at 60% 70%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 80% 20%, #fff, transparent),
    radial-gradient(1px 1px at 40% 80%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 90% 50%, #fff, transparent),
    radial-gradient(1px 1px at 10% 60%, #fff, transparent),
    radial-gradient(1px 1px at 30% 90%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 70% 40%, #fff, transparent);
  opacity:.40;
  animation:twinkle 5s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:.35}
  50%{opacity:.65}
}

/* Modo día */
body.dia .bg-layer{
  background:
    radial-gradient(circle at 15% 10%, rgba(255,45,149,.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(0,217,255,.10), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(168,85,247,.06), transparent 55%),
    linear-gradient(160deg, #e8e4ff 0%, #f5f0ff 50%, #e8e4ff 100%);
}
body.dia .bg-layer::before{opacity:.15}

/* Modo show - más oscuro */
body.show .bg-layer{
  background:
    radial-gradient(circle at 15% 10%, rgba(255,45,149,.28), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(0,217,255,.22), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(168,85,247,.14), transparent 55%),
    linear-gradient(160deg, #000 0%, #0a0420 50%, #000 100%);
}

/* ══════ WRAP ══════ */
.wrap{max-width:880px;margin:0 auto}

/* ══════ HEADER ══════ */
.top{
  position:relative;
  background:
    linear-gradient(135deg, rgba(18,6,58,.92), rgba(10,4,32,.92)) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7, #00d9ff, #39ff88, #ffe14a) border-box;
  border:1.5px solid transparent;
  border-radius:22px;
  padding:14px 16px;
  display:flex;align-items:center;gap:13px;
  box-shadow:
    0 0 24px rgba(255,45,149,.22),
    0 0 48px rgba(0,217,255,.12),
    var(--shadow);
  margin-bottom:12px;
}
body.dia .top{
  background:
    linear-gradient(135deg, #ffffff, #faf5ff) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7, #00d9ff, #39ff88, #ffe14a) border-box;
  box-shadow:0 8px 24px rgba(168,85,247,.18);
}
body.show .top{
  background:
    linear-gradient(135deg, rgba(0,0,0,.92), rgba(10,4,32,.92)) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7, #00d9ff, #39ff88, #ffe14a) border-box;
  box-shadow:
    0 0 32px rgba(255,45,149,.32),
    0 0 56px rgba(0,217,255,.18),
    var(--shadow);
}

.logo{
  width:52px;height:52px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg, #ff2d95, #a855f7 40%, #00d9ff 70%, #ffe14a 100%);
  display:grid;place-items:center;
  font-family:Georgia,serif;font-weight:900;font-size:1.55rem;color:#fff;
  text-shadow:0 0 8px rgba(0,0,0,.55), 0 0 2px #fff;
  box-shadow:
    0 0 0 3px rgba(255,255,255,.10),
    0 0 20px rgba(255,45,149,.35),
    0 0 40px rgba(0,217,255,.20);
}

.brand h1{
  font-family:Georgia,'Times New Roman',serif;
  font-size:1.24rem;color:#fff;letter-spacing:1.5px;line-height:1.1;
  text-shadow:0 0 12px rgba(255,45,149,.30), 0 0 24px rgba(0,217,255,.15);
}
body.dia .brand h1{color:#0b1220;text-shadow:none}
body.show .brand h1{color:#ffe14a;text-shadow:0 0 16px rgba(255,225,74,.55)}
.brand p{
  font-size:.72rem;color:var(--sub);letter-spacing:.7px;margin-top:3px;font-weight:700;
}
body.dia .brand p{color:#6b7a8f}

/* ══════ MODOS ══════ */
.modos{display:flex;gap:6px;margin-bottom:12px}
.modos button{
  flex:1;padding:9px 8px;border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);
  color:var(--text);
  font-family:inherit;font-size:.78rem;font-weight:800;cursor:pointer;
  transition:.15s;
}
body.dia .modos button{background:#fff;border-color:#e2e8f0;color:#0b1220}
.modos button.on{
  background:linear-gradient(135deg, var(--pink), var(--purple));
  color:#fff;border-color:var(--pink);
  box-shadow:0 0 16px rgba(255,45,149,.45);
}
body.dia .modos button.on{
  background:linear-gradient(135deg, var(--pink), var(--purple));
  color:#fff;
}

/* ══════ GLOBAL PROGRESS ══════ */
.global{
  background:var(--card);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-radius:14px;padding:11px 15px;
  display:flex;align-items:center;gap:11px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  margin-bottom:12px;
  border:1px solid var(--border-soft);
}
body.dia .global{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
body.show .global{background:rgba(0,0,0,.72);border-color:rgba(255,45,149,.30)}
.global .lbl{
  font-size:.68rem;font-weight:800;color:var(--sub);
  text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;
}
body.dia .global .lbl{color:#6b7a8f}
.global .num{font-size:.76rem;font-weight:900;color:var(--yellow);white-space:nowrap}
body.dia .global .num{color:#b8860b}

.bar{
  flex:1;height:10px;background:rgba(255,255,255,.08);
  border-radius:20px;overflow:hidden;min-width:50px;
  border:1px solid rgba(255,255,255,.06);
}
body.dia .bar{background:#e8edf4;border-color:transparent}
.bar>i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg, #ff2d95, #a855f7 40%, #00d9ff 70%, #ffe14a 100%);
  border-radius:20px;transition:width .35s ease;
  box-shadow:0 0 10px rgba(255,45,149,.45);
}
.bar.small{height:7px}

/* ══════ HOME - LISTA SETLISTS ══════ */
.h2{
  font-family:Georgia,serif;font-size:1.05rem;font-weight:900;
  color:var(--text);margin:16px 0 10px;letter-spacing:.3px;
}
body.dia .h2{color:#0b1220}
body.show .h2{color:var(--yellow)}

.sl-card{
  background:var(--card);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;
  border:1px solid var(--border-soft);
  border-left:5px solid var(--yellow);
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  cursor:pointer;transition:.2s;
  display:flex;align-items:center;gap:13px;
}
.sl-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.45)}
body.dia .sl-card{background:#fff;border-color:#e2e8f0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
body.show .sl-card{background:rgba(0,0,0,.72);border-color:rgba(255,45,149,.30)}

.sl-card.tipo-oficial{border-left-color:#ff2d95}
.sl-card.tipo-ensayo{border-left-color:#00d9ff}
.sl-card.tipo-show{border-left-color:#a855f7}
.sl-card.tipo-otro{border-left-color:#39ff88}

.sl-icono{
  font-size:1.7rem;width:48px;height:48px;border-radius:12px;
  display:grid;place-items:center;flex:0 0 auto;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
}
body.dia .sl-icono{background:#faf5ff;border-color:#e2e8f0}
body.show .sl-icono{background:rgba(255,255,255,.06)}

.sl-info{flex:1;min-width:0}
.sl-tipo{
  display:inline-block;font-size:.62rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.7px;padding:2px 9px;border-radius:20px;margin-bottom:4px;
}
.sl-tipo.oficial{background:linear-gradient(135deg,#ff2d95,#a855f7);color:#fff}
.sl-tipo.ensayo{background:linear-gradient(135deg,#00d9ff,#4a8fe0);color:#fff}
.sl-tipo.show{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.sl-tipo.otro{background:linear-gradient(135deg,#39ff88,#12b886);color:#0b1220}

.sl-nombre{font-size:.92rem;font-weight:900;color:var(--text);line-height:1.25}
body.dia .sl-nombre{color:#0b1220}
body.show .sl-nombre{color:var(--yellow)}
.sl-meta{font-size:.7rem;color:var(--sub);font-weight:700;margin-top:2px}
body.dia .sl-meta{color:#6b7a8f}
.sl-num{
  font-family:Georgia,serif;font-size:1.15rem;font-weight:900;color:var(--yellow);
  background:rgba(255,225,74,.14);
  padding:6px 12px;border-radius:20px;
  border:1px solid rgba(255,225,74,.30);white-space:nowrap;flex:0 0 auto;
}
body.dia .sl-num{color:#b8860b;background:rgba(255,225,74,.20);border-color:rgba(184,134,11,.30)}

.btn-prim{
  width:100%;
  background:linear-gradient(135deg, #ff2d95, #a855f7 50%, #00d9ff 100%);
  color:#fff;border:none;padding:14px 18px;border-radius:14px;
  font-family:inherit;font-weight:900;font-size:.88rem;cursor:pointer;
  box-shadow:0 4px 18px rgba(255,45,149,.40);
  transition:.15s;margin-top:8px;letter-spacing:.5px;
  text-shadow:0 1px 3px rgba(0,0,0,.30);
}
.btn-prim:active{transform:scale(.98)}

/* ══════ DETAIL VIEW ══════ */
.back{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);
  color:var(--text);border:1px solid rgba(255,255,255,.15);
  padding:9px 16px;border-radius:30px;
  font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit;
  margin-bottom:12px;transition:.15s;
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
}
.back:hover{background:var(--pink);color:#fff;border-color:var(--pink)}
body.dia .back{background:#fff;color:#0b1220;border-color:#e2e8f0}
body.show .back{background:rgba(0,0,0,.72);color:var(--yellow);border-color:rgba(255,225,74,.30)}

.detail-head{
  background:
    linear-gradient(135deg, rgba(18,6,58,.92), rgba(10,4,32,.92)) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7, #00d9ff, #ffe14a) border-box;
  border:1.5px solid transparent;
  border-radius:18px;padding:18px 20px;margin-bottom:12px;
  box-shadow:
    0 0 24px rgba(255,45,149,.18),
    0 0 48px rgba(0,217,255,.10),
    var(--shadow);
}
body.dia .detail-head{
  background:
    linear-gradient(135deg, #fff, #faf5ff) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7, #00d9ff, #ffe14a) border-box;
  box-shadow:0 6px 20px rgba(168,85,247,.18);
}
body.show .detail-head{
  background:
    linear-gradient(135deg, rgba(0,0,0,.92), rgba(10,4,32,.92)) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7, #00d9ff, #ffe14a) border-box;
}

.detail-head .tipo{
  display:inline-block;font-size:.64rem;font-weight:900;text-transform:uppercase;
  letter-spacing:.8px;padding:3px 10px;border-radius:20px;margin-bottom:8px;
}
.detail-head .tipo.oficial{background:linear-gradient(135deg,#ff2d95,#a855f7);color:#fff}
.detail-head .tipo.ensayo{background:linear-gradient(135deg,#00d9ff,#4a8fe0);color:#fff}
.detail-head .tipo.show{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.detail-head .tipo.otro{background:linear-gradient(135deg,#39ff88,#12b886);color:#0b1220}

.detail-head h2{
  font-family:Georgia,serif;font-size:1.3rem;color:#fff;
  line-height:1.2;margin-bottom:6px;letter-spacing:.3px;
  text-shadow:0 0 16px rgba(255,45,149,.30);
}
body.dia .detail-head h2{color:#0b1220;text-shadow:none}
body.show .detail-head h2{color:var(--yellow);text-shadow:0 0 20px rgba(255,225,74,.45)}
.detail-head .meta{font-size:.75rem;color:var(--sub);font-weight:700}
body.dia .detail-head .meta{color:#6b7a8f}

/* ══════ SECCIONES POR BANDA ══════ */
.band-section{margin-bottom:16px}

.band-section-head{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-radius:14px;margin-bottom:8px;
  border:1.5px solid transparent;
  background:rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  position:relative;
}

/* Coldplay - arcoíris Mylo Xyloto */
.band-section[data-band="cp"] .band-section-head{
  background:
    linear-gradient(135deg, rgba(255,45,149,.22), rgba(168,85,247,.18) 40%, rgba(0,217,255,.16) 70%, rgba(255,225,74,.20) 100%) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7 40%, #00d9ff 70%, #ffe14a 100%) border-box;
  box-shadow:
    0 0 24px rgba(255,45,149,.25),
    0 0 40px rgba(0,217,255,.12),
    inset 0 0 24px rgba(255,225,74,.06);
}
body.dia .band-section[data-band="cp"] .band-section-head{
  background:
    linear-gradient(135deg, rgba(255,45,149,.10), rgba(168,85,247,.08) 40%, rgba(0,217,255,.08) 70%, rgba(255,225,74,.10) 100%) padding-box,
    linear-gradient(135deg, #ff2d95, #a855f7 40%, #00d9ff 70%, #ffe14a 100%) border-box;
  box-shadow:0 4px 14px rgba(255,45,149,.18);
}

/* Keane - cian */
.band-section[data-band="ke"] .band-section-head{
  background:
    linear-gradient(135deg, rgba(0,217,255,.20), rgba(74,143,224,.14)) padding-box,
    linear-gradient(135deg, #00d9ff, #4a8fe0) border-box;
  box-shadow:
    0 0 24px rgba(0,217,255,.28),
    inset 0 0 24px rgba(0,217,255,.06);
}
body.dia .band-section[data-band="ke"] .band-section-head{
  background:
    linear-gradient(135deg, rgba(0,217,255,.10), rgba(74,143,224,.08)) padding-box,
    linear-gradient(135deg, #00d9ff, #4a8fe0) border-box;
  box-shadow:0 4px 14px rgba(0,217,255,.18);
}

/* Travis - verde */
.band-section[data-band="tr"] .band-section-head{
  background:
    linear-gradient(135deg, rgba(57,255,136,.20), rgba(18,184,134,.14)) padding-box,
    linear-gradient(135deg, #39ff88, #12b886) border-box;
  box-shadow:
    0 0 24px rgba(57,255,136,.28),
    inset 0 0 24px rgba(57,255,136,.06);
}
body.dia .band-section[data-band="tr"] .band-section-head{
  background:
    linear-gradient(135deg, rgba(57,255,136,.10), rgba(18,184,134,.08)) padding-box,
    linear-gradient(135deg, #39ff88, #12b886) border-box;
  box-shadow:0 4px 14px rgba(57,255,136,.18);
}

.band-section-emoji{font-size:1.35rem;flex:0 0 auto}
.band-section-name{
  font-family:Georgia,serif;font-size:1.02rem;font-weight:900;
  letter-spacing:1.6px;text-transform:uppercase;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.50);
  flex:1;min-width:0;
}
body.dia .band-section-name{color:#0b1220;text-shadow:none}
body.show .band-section-name{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.30)}

.band-section[data-band="cp"] .band-section-name{
  color:#ffd6ec;
  text-shadow:0 0 14px rgba(255,45,149,.60), 0 0 4px rgba(255,255,255,.30);
}
body.dia .band-section[data-band="cp"] .band-section-name{
  color:#c81d6e;
  text-shadow:none;
}

.band-section[data-band="ke"] .band-section-name{
  color:#c8f5ff;
  text-shadow:0 0 14px rgba(0,217,255,.55), 0 0 4px rgba(255,255,255,.25);
}
body.dia .band-section[data-band="ke"] .band-section-name{
  color:#0a94b8;
  text-shadow:none;
}

.band-section[data-band="tr"] .band-section-name{
  color:#c8ffdd;
  text-shadow:0 0 14px rgba(57,255,136,.55), 0 0 4px rgba(255,255,255,.25);
}
body.dia .band-section[data-band="tr"] .band-section-name{
  color:#0a8a5c;
  text-shadow:none;
}

.band-section-count{
  font-size:.72rem;font-weight:900;color:#fff;
  background:rgba(0,0,0,.35);
  padding:4px 11px;border-radius:20px;
  letter-spacing:.4px;white-space:nowrap;flex:0 0 auto;
}
body.dia .band-section-count{background:rgba(0,0,0,.08);color:#0b1220}
body.show .band-section-count{background:rgba(0,0,0,.55)}

/* ══════ SONGS ══════ */
.songs-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 4px;margin-bottom:6px;
}
.songs-head h3{
  font-family:Georgia,serif;font-size:.95rem;font-weight:900;color:var(--text);
}
body.dia .songs-head h3{color:#0b1220}
body.show .songs-head h3{color:var(--yellow)}
.songs-head .cnt{
  font-size:.72rem;font-weight:900;color:var(--yellow);
  background:rgba(255,225,74,.14);
  padding:4px 12px;border-radius:20px;
  border:1px solid rgba(255,225,74,.30);
}

.song{
  display:flex;align-items:center;gap:9px;
  background:var(--card);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border-radius:13px;padding:10px 12px;margin-bottom:7px;
  border:1px solid var(--border-soft);
  border-left:3px solid var(--yellow);
  transition:.15s;
}
.song:hover{box-shadow:0 4px 14px rgba(0,0,0,.30)}
body.dia .song{background:#fff;border-color:#e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
body.show .song{background:rgba(0,0,0,.65);border-color:rgba(255,45,149,.20)}

.song.listo{
  background:linear-gradient(90deg, rgba(255,225,74,.10), rgba(255,45,149,.03));
}
body.dia .song.listo{background:linear-gradient(90deg, rgba(255,225,74,.15), #fff)}
body.show .song.listo{background:linear-gradient(90deg, rgba(255,225,74,.14), rgba(0,0,0,.65))}

/* Borde izquierdo por banda */
.band-section[data-band="cp"] .song{border-left-color:#ff2d95}
.band-section[data-band="ke"] .song{border-left-color:#00d9ff}
.band-section[data-band="tr"] .song{border-left-color:#39ff88}

.chk{
  width:30px;height:30px;flex:0 0 auto;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.05);
  color:transparent;
  font-size:.85rem;font-weight:900;cursor:pointer;
  display:grid;place-items:center;transition:.16s;

<body>

<div class="bg-layer"></div>

<div class="wrap">

  <!-- ══════ HOME ══════ -->

<script>
/* ═══════════════════════════════════════════════════════════
   CANCIONES · 32 temas agrupadas por banda + alfabético
   ═══════════════════════════════════════════════════════════ */
const CANCIONES = [
  // ── COLDPLAY (12) ──
  { id:'coldplay-adventure-of-a-lifetime', t:'Adventure of a Lifetime', b:'Coldplay', bc:'cp' },
  { id:'coldplay-clocks',                  t:'Clocks', b:'Coldplay', bc:'cp' },
  { id:'coldplay-dont-panic',              t:"Don't Panic", b:'Coldplay', bc:'cp' },
  { id:'coldplay-fix-you',                 t:'Fix You', b:'Coldplay', bc:'cp' },
  { id:'coldplay-in-my-place',             t:'In My Place', b:'Coldplay', bc:'cp' },
  { id:'coldplay-magic',                   t:'Magic', b:'Coldplay', bc:'cp' },
  { id:'coldplay-shiver',                  t:'Shiver', b:'Coldplay', bc:'cp' },
  { id:'coldplay-speed-of-sound',          t:'Speed of Sound', b:'Coldplay', bc:'cp' },
  { id:'coldplay-the-scientist',           t:'The Scientist', b:'Coldplay', bc:'cp' },
  { id:'coldplay-trouble',                 t:'Trouble', b:'Coldplay', bc:'cp' },
  { id:'coldplay-viva-la-vida',            t:'Viva la Vida', b:'Coldplay', bc:'cp' },
  { id:'coldplay-yellow',                  t:'Yellow', b:'Coldplay', bc:'cp' },
  // ── KEANE (10) ──
  { id:'keane-bedshaped',                  t:'Bedshaped', b:'Keane', bc:'ke' },
  { id:'keane-bend-break',                 t:'Bend & Break', b:'Keane', bc:'ke' },
  { id:'keane-crystal-ball',               t:'Crystal Ball', b:'Keane', bc:'ke' },
  { id:'keane-everybodys-changing',        t:"Everybody's Changing", b:'Keane', bc:'ke' },
  { id:'keane-is-it-any-wonder',           t:'Is It Any Wonder?', b:'Keane', bc:'ke' },
  { id:'keane-nothing-in-my-way',          t:'Nothing in My Way', b:'Keane', bc:'ke' },
  { id:'keane-somewhere-only-we-know',     t:'Somewhere Only We Know', b:'Keane', bc:'ke' },
  { id:'keane-this-is-the-last-time',      t:'This Is the Last Time', b:'Keane', bc:'ke' },
  { id:'keane-we-might-as-well-be-strangers', t:'We Might as Well Be Strangers', b:'Keane', bc:'ke' },
  { id:'keane-your-eyes-open',             t:'Your Eyes Open', b:'Keane', bc:'ke' },
  // ── TRAVIS (10) ──
  { id:'travis-all-i-want-to-do-is-rock',  t:'All I Want to Do Is Rock', b:'Travis', bc:'tr' },
  { id:'travis-closer',                    t:'Closer', b:'Travis', bc:'tr' },
  { id:'travis-happy-to-hang-around',      t:'Happy to Hang Around', b:'Travis', bc:'tr' },
  { id:'travis-re-offender',               t:'Re-Offender', b:'Travis', bc:'tr' },
  { id:'travis-side',                      t:'Side', b:'Travis', bc:'tr' },
  { id:'travis-sing',                      t:'Sing', b:'Travis', bc:'tr' },
  { id:'travis-the-beautiful-occupation',  t:'The Beautiful Occupation', b:'Travis', bc:'tr' },
  { id:'travis-turn',                      t:'Turn', b:'Travis', bc:'tr' },
  { id:'travis-why-does-it-always-rain-on-me', t:'Why Does It Always Rain on Me?', b:'Travis', bc:'tr' },
  { id:'travis-writing-to-reach-you',      t:'Writing to Reach You', b:'Travis', bc:'tr' }
];

const SONG_MAP = {};
CANCIONES.forEach(s => SONG_MAP[s.id] = s);

const BAND_ORDER = ['Coldplay', 'Keane', 'Travis'];
const BAND_META = {
  Coldplay: { emoji:'🌙', dataBand:'cp' },
  Keane:    { emoji:'🎹', dataBand:'ke' },
  Travis:   { emoji:'🌧️', dataBand:'tr' }
};

const OFICIAL_IDS = CANCIONES.map(s => s.id);

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const KEY = 'devon-tribute-v1';

function initialState(){
  return {
    v: 1,
    modo: 'noche',
    letras: {},
    links: {},
    setlists: [
      { id:'oficial', nombre:'Setlist Oficial', tipo:'oficial', fecha:'',
        canciones:[...OFICIAL_IDS], checks:{} }
    ]
  };
}

let state = load();

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return initialState();
    const p = JSON.parse(raw);
    const base = initialState();
    return {
      v: 1,
      modo: p.modo || 'noche',
      letras: p.letras || {},
      links: p.links || {},
      setlists: Array.isArray(p.setlists) && p.setlists.length ? p.setlists : base.setlists
    };
  } catch(e){ return initialState(); }
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   UTILIDADES
   ═══════════════════════════════════════════════════════════ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function avisar(txt){
  const el = document.getElementById('aviso');
  el.textContent = txt;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}
function ytSearch(q){
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
}
function linkOrig(id){
  const s = SONG_MAP[id];
  return (state.links[id] && state.links[id].orig) ||
    ytSearch(s.b + ' ' + s.t + ' official audio');
}
function linkLive(id){
  const s = SONG_MAP[id];
  return (state.links[id] && state.links[id].live) ||
    ytSearch(s.b + ' ' + s.t + ' live');
}

/* ═══════════════════════════════════════════════════════════
   MODOS
   ═══════════════════════════════════════════════════════════ */
function cambiarModo(modo){
  document.body.classList.remove('dia','show');
  if (modo === 'dia') document.body.classList.add('dia');
  else if (modo === 'show') document.body.classList.add('show');
  document.querySelectorAll('.modos button').forEach(b =>
    b.classList.toggle('on', b.dataset.modo === modo));
  state.modo = modo;
  save();
}

/* ═══════════════════════════════════════════════════════════
   PROGRESO GLOBAL
   ═══════════════════════════════════════════════════════════ */
function refreshGlobal(){
  let total = 0, hechas = 0;
  state.setlists.forEach(sl => {
    total += sl.canciones.length;
    hechas += sl.canciones.filter(id => sl.checks[id]).length;
  });
  const pct = total ? Math.round(hechas / total * 100) : 0;
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('globalTxt').textContent = hechas + '/' + total + ' · ' + pct + '%';
}

/* ═══════════════════════════════════════════════════════════
   HOME
   ═══════════════════════════════════════════════════════════ */
function renderHome(){
  const cont = document.getElementById('lista-setlists');
  if (!state.setlists.length){
    cont.innerHTML = '<div class="empty"><strong>Sin setlists</strong>Tocá "Crear nuevo setlist" para empezar.</div>';
    return;
  }
  cont.innerHTML = state.setlists.map(sl => {
    const total = sl.canciones.length;
    const hechas = sl.canciones.filter(id => sl.checks[id]).length;
    const emoji = sl.tipo === 'oficial' ? '🎯' : sl.tipo === 'show' ? '🎉' : sl.tipo === 'ensayo' ? '🎤' : '🎵';
    return `
      <div class="sl-card tipo-${sl.tipo}" onclick="abrirSetlist('${sl.id}')">
        <div class="sl-icono">${emoji}</div>
        <div class="sl-info">
          <span class="sl-tipo ${sl.tipo}">${sl.tipo}</span>
          <div class="sl-nombre">${esc(sl.nombre)}</div>
          <div class="sl-meta">${sl.fecha ? '📅 ' + sl.fecha + ' · ' : ''}${hechas} de ${total} listas</div>
        </div>
        <div class="sl-num">${total}</div>
      </div>
    `;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   ABRIR / CERRAR SETLIST
   ═══════════════════════════════════════════════════════════ */
let currentSetlistId = null;

function abrirSetlist(id){
  currentSetlistId = id;
  document.getElementById('view-home').hidden = true;
  document.getElementById('view-detail').hidden = false;
  renderDetail();
  window.scrollTo({top:0, behavior:'instant'});
}

function volverHome(){
  currentSetlistId = null;
  document.getElementById('view-detail').hidden = true;
  document.getElementById('view-home').hidden = false;
  renderHome();
  refreshGlobal();
  window.scrollTo({top:0, behavior:'instant'});
}

function getSL(id){ return state.setlists.find(s => s.id === id); }

/* ═══════════════════════════════════════════════════════════
   RENDER: lista de canciones (sin secciones)
   ═══════════════════════════════════════════════════════════ */
function renderSongsList(songIds, sl){
  return songIds.map(id => {
    const s = SONG_MAP[id];
    if (!s) return '';
    const on = !!sl.checks[id];
    return `
      <div class="song ${on ? 'listo' : ''}">
        <button class="chk ${on ? 'on' : ''}" onclick="toggleCheck('${id}')">${on ? '✓' : ''}</button>
        <div class="song-info">
          <div class="song-t">${esc(s.t)}</div>
          <div class="song-b"><span class="dot ${s.bc}"></span>${esc(s.b)}</div>
        </div>
        <div class="acts">
          <a class="mini yt" href="${linkOrig(id)}" target="_blank" rel="noopener" title="Original">▶</a>
          <a class="mini live" href="${linkLive(id)}" target="_blank" rel="noopener" title="En vivo">🎬</a>
          <button class="mini letra" onclick="abrirLetra('${id}')" title="Letra">📄</button>
        </div>
      </div>
    `;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   RENDER: detalle del setlist
   ═══════════════════════════════════════════════════════════ */
function renderDetail(){
  const sl = getSL(currentSetlistId);
  if (!sl){ volverHome(); return; }

  const total = sl.canciones.length;
  const hechas = sl.canciones.filter(id => sl.checks[id]).length;
  const pct = total ? Math.round(hechas / total * 100) : 0;

  const emoji = sl.tipo === 'oficial' ? '🎯' : sl.tipo === 'show' ? '🎉' : sl.tipo === 'ensayo' ? '🎤' : '🎵';

  // Agrupar por banda
  const groups = BAND_ORDER.map(band => ({
    band,
    songs: sl.canciones.filter(id => SONG_MAP[id] && SONG_MAP[id].b === band)
  })).filter(g => g.songs.length > 0);

  let songsHTML = '';
  if (!sl.canciones.length){
    songsHTML = '<div class="empty"><strong>Sin canciones todavía</strong>Tocá "Agregar canciones" para sumar temas del repertorio.</div>';
  } else if (groups.length === 1){
    // Solo una banda → sin encabezados de sección
    songsHTML = renderSongsList(groups[0].songs, sl);
  } else {
    // Múltiples bandas → con secciones
    songsHTML = groups.map(g => {
      const meta = BAND_META[g.band];
      const groupHechas = g.songs.filter(id => sl.checks[id]).length;
      return `
        <div class="band-section" data-band="${meta.dataBand}">
          <div class="band-section-head">
            <span class="band-section-emoji">${meta.emoji}</span>
            <span class="band-section-name">${esc(g.band)}</span>
            <span class="band-section-count">${groupHechas}/${g.songs.length}</span>
          </div>
          <div class="band-section-songs">
            ${renderSongsList(g.songs, sl)}
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-head">
      <span class="tipo ${sl.tipo}">${emoji} ${sl.tipo}</span>
      <h2>${esc(sl.nombre)}</h2>
      <div class="meta">${sl.fecha ? '📅 ' + sl.fecha + ' · ' : ''}${hechas} de ${total} listas</div>
    </div>

    <div class="global" style="margin-bottom:10px">
      <span class="lbl">Avance</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span class="num">${pct}%</span>
    </div>

    <div class="songs-head">
      <h3>🎵 Canciones</h3>
      <span class="cnt">${total}</span>
    </div>

    ${songsHTML}

    <div class="row" style="margin-top:14px">
      <button class="btn btn-prim2" onclick="abrirPicker()">➕ Agregar canciones</button>
      ${sl.tipo !== 'oficial' ? `<button class="btn btn-danger" onclick="borrarSetlist()">🗑️ Borrar</button>` : ''}
    </div>
  `;
}

function toggleCheck(songId){
  const sl = getSL(currentSetlistId);
  if (!sl) return;
  if (sl.checks[songId]) delete sl.checks[songId];
  else sl.checks[songId] = 1;
  save();
  renderDetail();
}

/* ═══════════════════════════════════════════════════════════
   MODAL NUEVO SETLIST
   ═══════════════════════════════════════════════════════════ */
function abrirNuevoSetlist(){
  document.getElementById('ns-nombre').value = '';
  document.getElementById('ns-fecha').value = '';
  document.getElementById('ns-tipo').value = 'ensayo';
  document.getElementById('modal-nuevo').classList.add('open');
  setTimeout(() => document.getElementById('ns-nombre').focus(), 100);
}

function crearSetlist(){
  const tipo = document.getElementById('ns-tipo').value;
  const nombre = document.getElementById('ns-nombre').value.trim();
  const fecha = document.getElementById('ns-fecha').value;

  if (!nombre){ avisar('⚠️ Poné un nombre'); return; }

  state.setlists.push({
    id: 'sl-' + Date.now(),
    nombre: nombre,
    tipo: tipo,
    fecha: fecha,
    canciones: [],
    checks: {}
  });
  save();
  closeModal('modal-nuevo');
  renderHome();
  refreshGlobal();
  avisar('✅ Setlist creado');
}

/* ═══════════════════════════════════════════════════════════
   PICKER DE CANCIONES
   ═══════════════════════════════════════════════════════════ */
let pickerSel = new Set();

function abrirPicker(){
  const sl = getSL(currentSetlistId);
  if (!sl) return;
  document.getElementById('picker-sub').textContent = sl.nombre;
  pickerSel = new Set(sl.canciones);
  document.getElementById('picker-buscar').value = '';
  renderPicker();
  document.getElementById('modal-picker').classList.add('open');
}

function renderPicker(){
  let html = '';
  BAND_ORDER.forEach(band => {
    const meta = BAND_META[band];
    const bandSongs = CANCIONES.filter(s => s.b === band);
    if (!bandSongs.length) return;
    html += `<div class="pick-band">${meta.emoji} ${band}</div>`;
    bandSongs.forEach(s => {
      const sel = pickerSel.has(s.id);
      html += `
        <div class="pick-row ${sel ? 'sel' : ''}" data-pick="${s.id}" data-search="${esc((s.t + ' ' + s.b).toLowerCase())}">
          <div class="box">${sel ? '✓' : ''}</div>
          <div class="pick-info">
            ${esc(s.t)}
            <div class="pick-b">${s.b}</div>
          </div>
        </div>
      `;
    });
  });
  document.getElementById('picker-lista').innerHTML = html;
}

function confirmarPicker(){
  const sl = getSL(currentSetlistId);
  if (!sl) return;
  // Orden: Coldplay → Keane → Travis, cada grupo alfabético (el array ya viene así)
  sl.canciones = CANCIONES.filter(s => pickerSel.has(s.id)).map(s => s.id);
  // Limpiar checks de canciones que ya no están
  Object.keys(sl.checks).forEach(id => {
    if (!sl.canciones.includes(id)) delete sl.checks[id];
  });
  save();
  closeModal('modal-picker');
  renderDetail();
  avisar('✅ Canciones guardadas');
}

/* ═══════════════════════════════════════════════════════════
   MODAL LETRA
   ═══════════════════════════════════════════════════════════ */
let letraActualId = null;

function abrirLetra(songId){
  const s = SONG_MAP[songId];
  if (!s) return;
  letraActualId = songId;
  document.getElementById('letra-title').textContent = s.t;
  document.getElementById('letra-sub').textContent = s.b;
  document.getElementById('letra-input').value = state.letras[songId] || '';
  document.getElementById('modal-letra').classList.add('open');
}

function guardarLetra(){
  if (!letraActualId) return;
  const txt = document.getElementById('letra-input').value.trim();
  if (txt) state.letras[letraActualId] = txt;
  else delete state.letras[letraActualId];
  save();
  closeModal('modal-letra');
  avisar('💾 Letra guardada');
}

/* ═══════════════════════════════════════════════════════════
   BORRAR SETLIST
   ═══════════════════════════════════════════════════════════ */
function borrarSetlist(){
  const sl = getSL(currentSetlistId);
  if (!sl || sl.tipo === 'oficial') return;
  if (!confirm('¿Borrar el setlist "' + sl.nombre + '"? No se puede deshacer.')) return;
  state.setlists = state.setlists.filter(s => s.id !== sl.id);
  save();
  volverHome();
  avisar('🗑️ Setlist borrado');
}

/* ═══════════════════════════════════════════════════════════
   MODALES · ABRIR/CERRAR
   ═══════════════════════════════════════════════════════════ */
function closeModal(id){
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.modal-root').forEach(root => {
  root.addEventListener('click', e => {
    if (e.target.matches('[data-close]') || e.target.matches('.modal-bg')){
      root.classList.remove('open');
    }
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    document.querySelectorAll('.modal-root.open').forEach(m => m.classList.remove('open'));
  }
});

/* ═══════════════════════════════════════════════════════════
   DELEGACIÓN · PICKER + BUSCAR
   ═══════════════════════════════════════════════════════════ */
document.getElementById('picker-lista').addEventListener('click', e => {
  const row = e.target.closest('[data-pick]');
  if (!row) return;
  const id = row.dataset.pick;
  if (pickerSel.has(id)) pickerSel.delete(id);
  else pickerSel.add(id);
  renderPicker();
});

document.getElementById('picker-buscar').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('#picker-lista .pick-row').forEach(row => {
    const ok = !q || row.dataset.search.indexOf(q) !== -1;
    row.style.display = ok ? '' : 'none';
  });
});

/* ═══════════════════════════════════════════════════════════
   INICIALIZAR
   ═══════════════════════════════════════════════════════════ */
cambiarModo(state.modo || 'noche');
renderHome();
refreshGlobal();

// PWA
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
